<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THEMEE</title>
<style>
html,body{margin:0;height:100%;background:#14213d;overflow:hidden}
canvas{position:absolute;top:0;left:0;right:0;bottom:0;margin:auto;cursor:none}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
'use strict';
const W=1280,H=720,GROUND=640,PLAT_H=28;
const G=2000,SPEED=330,JUMP=750,BOUNCE=1300;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';}
addEventListener('resize',fit);fit();
cv.addEventListener('dblclick',()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();});
cv.addEventListener('click',audioOn);

/* ---------- Sons synthétisés (aucun fichier externe) ---------- */
let AC=null;
function audioOn(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,t0,dur,type,vol,slide){
  if(!AC)return;
  const now=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,now);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),now+dur);
  g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(vol,now+0.012);g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  o.connect(g).connect(AC.destination);o.start(now);o.stop(now+dur+0.05);
}
const SFX={
  jump(){tone(280,0,0.14,'square',0.05,320);},
  bounce(){tone(180,0,0.3,'sine',0.14,600);},
  land(){tone(110,0,0.06,'triangle',0.04);},
  letter(n){[523,659,784,1047].forEach((f,k)=>tone(f*(1+n*0.03),k*0.06,0.2,'triangle',0.13));},
  star(){[880,1109,1319,1760,2093].forEach((f,k)=>tone(f,k*0.05,0.25,'sine',0.1));},
  win(){
    [523,523,523,659,784,659,784,1047].forEach((f,k)=>tone(f,k*0.14,0.26,'square',0.07));
    [262,330,392,523].forEach((f,k)=>tone(f,k*0.28,0.5,'triangle',0.07));
    tone(1047,1.15,0.9,'triangle',0.1);
  },
  start(){[392,523,659].forEach((f,k)=>tone(f,k*0.08,0.2,'triangle',0.1));}
};

/* ---------- Joueurs et clavier ---------- */
const PLAYERS=[
  {color:'#ff5a5f',dark:'#b8343a',keys:['KeyA','KeyD','KeyW'],labels:['Q','D','Z']},
  {color:'#3ec1ff',dark:'#1a7fb0',keys:['ArrowLeft','ArrowRight','ArrowUp'],labels:['←','→','↑']},
  {color:'#8ad94a',dark:'#4e9420',keys:['KeyJ','KeyL','KeyI'],labels:['J','L','I']},
];
if(navigator.keyboard&&navigator.keyboard.getLayoutMap){
  navigator.keyboard.getLayoutMap().then(m=>{
    for(const p of PLAYERS)p.labels=p.keys.map((k,i)=>k.startsWith('Arrow')?p.labels[i]:(m.get(k)||p.labels[i]).toUpperCase());
  }).catch(()=>{});
}
const keys={};
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  keys[e.code]=true;audioOn();onKey(e.code);
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

/* ---------- Niveaux : plateformes [x, y, largeur, 'b' = trampoline] ---------- */
const LEVELS=[
  {sky:['#5fb8ff','#dff4ff'],grass:'#5cc23c',dirt:'#9a6b3b',plats:[[200,530,220],[860,530,220],[530,420,220]]},
  {sky:['#7ccbff','#fff3c4'],grass:'#6bcc48',dirt:'#a0703f',plats:[[80,530,200],[340,430,200],[600,330,200],[860,430,200],[1120,530,140]]},
  {sky:['#ff8a5c','#ffd98a'],grass:'#7fbf4a',dirt:'#8f5b35',plats:[[100,520,200],[980,520,200],[540,460,200],[300,360,160],[820,360,160],[540,260,200],[60,612,160,'b']]},
  {sky:['#0b1b4d','#3b3f8f'],night:true,grass:'#4f8fcf',dirt:'#2d3a66',plats:[[60,540,140],[260,450,140],[460,540,140],[660,450,140],[860,540,140],[1060,450,140],[160,340,140],[560,330,140],[960,330,140],[360,230,140],[760,230,140],[560,130,140]]},
  {sky:['#ffc14d','#ffe9b3'],grass:'#d9b25c',dirt:'#b57a3a',plats:[[440,540,400],[500,440,280],[560,340,160],[100,540,160],[1020,540,160],[40,440,120],[1120,440,120],[300,612,120,'b'],[860,612,120,'b']]},
  {sky:['#3a0a1a','#b3302e'],night:true,grass:'#ff8c42',dirt:'#4a2020',plats:[[200,480,160],[920,480,160],[560,380,160],[560,250,160],[60,300,140],[1080,300,140],[40,612,140,'b'],[1100,612,140,'b']]},
];
const LETTERS=[['T','#ff5a5f'],['H','#ff9f1c'],['E','#ffd93d'],['M','#6bcb77'],['E','#4d96ff'],['E','#c77dff']];

function makeSpots(lv){
  const s=[];
  for(const [x,y,w,t] of lv.plats){
    if(t==='b')continue;
    if(w>=300)s.push([x+w*0.25,y-44],[x+w*0.75,y-44]);else s.push([x+w/2,y-44]);
  }
  for(let x=90;x<=1190;x+=137)s.push([x,GROUND-44]);
  return s;
}
function pickSpots(spots,n){
  for(const minD of [110,70,0]){
    const pool=spots.slice().sort(()=>Math.random()-0.5),out=[];
    for(const p of pool){
      if(out.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>minD)){out.push(p);if(out.length===n)return out;}
    }
  }
  return spots.slice(0,n);
}

/* ---------- État ---------- */
let state='title',levelIdx=0,level=LEVELS[0],players=[],items=[],particles=[],confetti=[],clouds=[],skyStars=[];
let levelTime=0,hintT=0,totalStars=0,levelStars=0,winT=0,slotPop=[0,0,0,0,0,0],starPop=0,T=0;

function makePlayers(xs){return PLAYERS.map((c,k)=>({cfg:c,id:k,x:xs[k],y:GROUND-56,w:48,h:56,vx:0,vy:0,dir:1,onGround:true,sx:1,sy:1,walk:0}));}
function setupScene(i){
  levelIdx=i%LEVELS.length;level=LEVELS[levelIdx];
  clouds=Array.from({length:6},()=>({x:Math.random()*W,y:40+Math.random()*220,s:0.6+Math.random()*0.8,v:8+Math.random()*14}));
  skyStars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*520,r:Math.random()*1.6+0.6,p:Math.random()*6}));
  particles=[];confetti=[];
}
function setupTitle(){
  setupScene(0);state='title';items=[];players=makePlayers([292,616,940]);
}
function startLevel(i){
  setupScene(i);
  players=makePlayers([540,616,692]);
  const sp=pickSpots(makeSpots(level),9).sort((a,b)=>a[1]-b[1]);
  items=[];
  sp.slice(0,3).forEach(p=>items.push({type:'star',x:p[0],y:p[1],taken:false,fly:0,bob:Math.random()*6}));
  const ls=sp.slice(3).sort(()=>Math.random()-0.5);
  LETTERS.forEach((L,k)=>items.push({type:'letter',ch:L[0],color:L[1],slot:k,x:ls[k][0],y:ls[k][1],taken:false,fly:0,bob:Math.random()*6}));
  levelTime=0;hintT=levelIdx===0?7:4;levelStars=0;slotPop=[0,0,0,0,0,0];
  state='play';
}
function nextLevel(){startLevel(levelIdx+1);}
function onKey(code){
  if(state==='title'){totalStars=0;SFX.start();startLevel(0);}
  else if(state==='play'){if(code==='Escape')setupTitle();}
  else if(state==='win'){if(code==='Escape')setupTitle();else if(winT>1.5)nextLevel();}
}

/* ---------- Physique ---------- */
function updatePlayers(dt,inputOf,quiet){
  for(const p of players){
    const inp=inputOf(p);
    const ax=(inp.R?1:0)-(inp.L?1:0);
    p.vx=ax*SPEED;if(ax)p.dir=ax;
    if(ax&&p.onGround)p.walk+=dt*14;
    const wasGround=p.onGround;
    p.vy=Math.min(1500,p.vy+G*dt);
    p.x=Math.max(0,Math.min(W-p.w,p.x+p.vx*dt));
    const prevB=p.y+p.h;p.y+=p.vy*dt;p.onGround=false;
    if(p.vy>=0){
      let landed=null;
      for(const pl of level.plats){const [x,y,w]=pl;if(p.x+p.w>x+4&&p.x<x+w-4&&prevB<=y+1&&p.y+p.h>=y){landed=pl;break;}}
      if(!landed&&p.y+p.h>=GROUND){
        landed=[0,GROUND,W];
        const tr=level.plats.find(([x,y,w,t])=>t==='b'&&y>=GROUND-40&&p.x+p.w>x+4&&p.x<x+w-4);
        if(tr){landed=tr;p.y=tr[1]-p.h;}
      }
      if(landed){
        p.y=landed[1]-p.h;
        if(landed[3]==='b'){p.vy=-BOUNCE;if(!quiet)SFX.bounce();p.sx=0.7;p.sy=1.4;dust(p,10);}
        else{p.vy=0;p.onGround=true;if(!wasGround){if(!quiet)SFX.land();p.sx=1.35;p.sy=0.7;dust(p,5);}}
      }
    }
    if(inp.J&&p.onGround){p.vy=-JUMP;p.onGround=false;if(!quiet)SFX.jump();p.sx=0.8;p.sy=1.25;}
    p.sx+=(1-p.sx)*Math.min(1,dt*10);p.sy+=(1-p.sy)*Math.min(1,dt*10);
    const cx=p.x+p.w/2,cy=p.y+p.h/2;
    for(const it of items){
      if(!it.taken&&Math.abs(cx-it.x)<p.w/2+26&&Math.abs(cy-it.y)<p.h/2+26)collect(it,p);
    }
  }
}
function collect(it,p){
  it.taken=true;it.fly=0;it.by=p.id;
  if(it.type==='letter'){const n=items.filter(i=>i.type==='letter'&&i.taken).length;SFX.letter(n);burst(it.x,it.y,it.color,24);}
  else{levelStars++;totalStars++;SFX.star();burst(it.x,it.y,'#ffd93d',30);}
}
function updateItems(dt){
  for(const it of items){
    if(it.taken&&it.fly<1){it.fly=Math.min(1,it.fly+dt*1.8);if(it.fly===1){if(it.type==='letter')slotPop[it.slot]=1;else starPop=1;}}
  }
  if(items.every(it=>it.taken&&it.fly>=1)){state='win';winT=0;SFX.win();spawnConfetti();}
}
function burst(x,y,color,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=120+Math.random()*260;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,life:0.6+Math.random()*0.5,t:0,color,r:3+Math.random()*5});}}
function dust(p,n){for(let i=0;i<n;i++)particles.push({x:p.x+Math.random()*p.w,y:p.y+p.h,vx:(Math.random()-0.5)*160,vy:-Math.random()*80,life:0.35,t:0,color:'rgba(255,255,255,0.7)',r:3+Math.random()*3});}
function updateParticles(dt){
  for(const q of particles){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=600*dt;}
  particles=particles.filter(q=>q.t<q.life);
}
function spawnConfetti(){confetti=Array.from({length:160},()=>({x:Math.random()*W,y:-20-Math.random()*500,vx:(Math.random()-0.5)*60,vy:120+Math.random()*160,r:Math.random()*Math.PI,vr:(Math.random()-0.5)*8,color:LETTERS[Math.floor(Math.random()*6)][1],w:8+Math.random()*8,h:5+Math.random()*6}));}

function update(dt){
  for(const c of clouds){c.x+=c.v*dt;if(c.x>W+120)c.x=-120;}
  updateParticles(dt);
  if(state==='title')updatePlayers(dt,()=>({J:true}),true);
  else if(state==='play'){
    levelTime+=dt;hintT-=dt;
    updatePlayers(dt,p=>{const k=p.cfg.keys;return{L:keys[k[0]],R:keys[k[1]],J:keys[k[2]]};},false);
    updateItems(dt);
  }else if(state==='win'){
    winT+=dt;
    updatePlayers(dt,()=>({J:true}),true);
    for(const c of confetti){c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=c.vr*dt;if(c.y>H+20){c.y=-20;c.x=Math.random()*W;}}
    if(winT>6.5)nextLevel();
  }
  for(let i=0;i<6;i++)slotPop[i]=Math.max(0,slotPop[i]-dt*3);
  starPop=Math.max(0,starPop-dt*3);
}

/* ---------- Dessin ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function starShape(x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);}ctx.closePath();}
function easeOutBack(t){const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);}
function font(px){ctx.font=`bold ${px}px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif`;}
function shadowText(t,x,y){ctx.save();ctx.shadowColor='rgba(0,0,0,0.5)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;ctx.fillStyle='#fff';ctx.fillText(t,x,y);ctx.restore();}
function fmtTime(s){s=Math.floor(s);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function keyCap(x,y,s,label,color){
  ctx.save();rr(x-s/2,y-s/2,s,s,s*0.22);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=color||'#333';ctx.stroke();
  ctx.fillStyle='#222';font(s*0.55);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,x,y+1);ctx.restore();
}
function cloud(x,y,s,col){ctx.fillStyle=col;[[0,0,34],[30,-10,28],[-32,-6,26],[60,4,22],[-60,6,20]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,r*s,0,7);ctx.fill();});}
function drawSky(th){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(th.night){
    ctx.fillStyle='#fff';
    for(const s of skyStars){ctx.globalAlpha=0.4+0.6*Math.abs(Math.sin(T*1.5+s.p));ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();}
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff7d6';ctx.beginPath();ctx.arc(1100,110,48,0,7);ctx.fill();
    ctx.fillStyle=th.sky[0];ctx.beginPath();ctx.arc(1122,96,40,0,7);ctx.fill();
  }else{
    ctx.fillStyle='rgba(255,240,150,0.95)';ctx.beginPath();ctx.arc(1120,110,56,0,7);ctx.fill();
  }
  for(const c of clouds)cloud(c.x,c.y,c.s,th.night?'rgba(255,255,255,0.15)':'rgba(255,255,255,0.9)');
  ctx.fillStyle=th.night?'rgba(0,0,0,0.25)':'rgba(255,255,255,0.3)';
  [[200,160],[700,220],[1150,140]].forEach(([x,r])=>{ctx.beginPath();ctx.arc(x,GROUND+60,r,0,7);ctx.fill();});
}
function drawPlat(x,y,w,t,th){
  if(t==='b'){
    ctx.fillStyle='#6a4c93';rr(x+10,y+10,w-20,PLAT_H,8);ctx.fill();
    ctx.fillStyle='#ff6fb5';rr(x,y,w,16,8);ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.beginPath();ctx.moveTo(x+8,y+8);ctx.lineTo(x+w-8,y+8);ctx.stroke();ctx.setLineDash([]);
  }else{
    ctx.fillStyle=th.dirt;rr(x,y,w,PLAT_H,8);ctx.fill();
    ctx.fillStyle=th.grass;rr(x,y,w,12,6);ctx.fill();
  }
}
function drawGround(th){ctx.fillStyle=th.dirt;ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle=th.grass;ctx.fillRect(0,GROUND,W,14);}
function slotPos(i){return [(W-434)/2+i*74+32,48];}
function drawItem(it){
  let x=it.x,y=it.y,sc=1;
  if(it.taken){
    if(it.fly>=1)return;
    const e=1-Math.pow(1-it.fly,3),[tx,ty]=it.type==='letter'?slotPos(it.slot):[64,44];
    x=it.x+(tx-it.x)*e;y=it.y+(ty-it.y)*e;sc=1-0.3*e;
  }else y+=Math.sin(T*3+it.bob)*6;
  ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  if(it.type==='letter'){
    ctx.rotate(Math.sin(T*2+it.bob)*0.08);
    ctx.shadowColor=it.color;ctx.shadowBlur=18;ctx.fillStyle=it.color;rr(-28,-28,56,56,14);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.25)';rr(-22,-22,44,20,10);ctx.fill();
    ctx.fillStyle='#fff';font(40);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.ch,0,2);
  }else{
    ctx.rotate(Math.sin(T*2.5+it.bob)*0.2);
    ctx.shadowColor='#ffd93d';ctx.shadowBlur=20;ctx.fillStyle='#ffd93d';starShape(0,0,28);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='#e0a800';ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();
  }
  ctx.restore();
}
function drawPlayer(p){
  const c=p.cfg;
  ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h);ctx.scale(p.sx,p.sy);
  const f=p.onGround&&p.vx!==0?Math.sin(p.walk)*6:0;
  ctx.fillStyle=c.dark;
  ctx.beginPath();ctx.ellipse(-12+f,-4,11,6,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(12-f,-4,11,6,0,0,7);ctx.fill();
  ctx.fillStyle=c.color;rr(-p.w/2,-p.h,p.w,p.h-4,18);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';rr(-p.w/2+6,-p.h+6,p.w-12,16,8);ctx.fill();
  const ex=p.dir*5,ey=-p.h+22;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-10+ex,ey,9,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(10+ex,ey,9,0,7);ctx.fill();
  ctx.fillStyle='#222';
  ctx.beginPath();ctx.arc(-10+ex+p.dir*3,ey+1,4.5,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(10+ex+p.dir*3,ey+1,4.5,0,7);ctx.fill();
  ctx.strokeStyle=c.dark;ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(ex,-p.h+34,7,0.15*Math.PI,0.85*Math.PI);ctx.stroke();
  ctx.restore();
}
function drawHint(p,alpha){
  const c=p.cfg,cx=p.x+p.w/2,top=p.y-14;
  ctx.save();ctx.globalAlpha=alpha;
  keyCap(cx,top-62,30,c.labels[2],c.color);keyCap(cx-32,top-28,30,c.labels[0],c.color);keyCap(cx+32,top-28,30,c.labels[1],c.color);
  ctx.restore();
}
function drawParticles(){for(const q of particles){ctx.globalAlpha=Math.max(0,1-q.t/q.life);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();}ctx.globalAlpha=1;}
function drawHUD(){
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<6;i++){
    const [x,y]=slotPos(i),it=items.find(o=>o.type==='letter'&&o.slot===i),filled=it&&it.taken&&it.fly>=1,sc=1+slotPop[i]*0.3;
    ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);font(44);
    if(filled){ctx.fillStyle=it.color;rr(-32,-32,64,64,14);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(it.ch,0,2);}
    else{ctx.fillStyle='rgba(0,0,0,0.3)';rr(-32,-32,64,64,14);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillText(LETTERS[i][0],0,2);}
    ctx.restore();
  }
  ctx.save();ctx.translate(64,44);ctx.scale(1+starPop*0.4,1+starPop*0.4);ctx.fillStyle='#ffd93d';starShape(0,0,26);ctx.fill();ctx.strokeStyle='#e0a800';ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();ctx.restore();
  font(40);ctx.textAlign='left';
  shadowText(String(totalStars),100,46);
  ctx.fillStyle='#fff';ctx.fillRect(190,22,4,46);ctx.fillStyle='#ff5a5f';ctx.beginPath();ctx.moveTo(194,22);ctx.lineTo(236,34);ctx.lineTo(194,46);ctx.fill();
  shadowText(String(levelIdx+1),246,46);
  ctx.textAlign='right';shadowText(fmtTime(levelTime),W-28,46);
}
function drawWin(){
  ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,W,H);
  for(const c of confetti){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle=c.color;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();}
  const size=150,gap=10,x0=(W-(6*size+5*gap))/2+size/2;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<6;i++){
    const t=Math.max(0,Math.min(1,(winT-0.1-i*0.13)/0.6));if(t<=0)continue;const s=easeOutBack(t);
    ctx.save();ctx.translate(x0+i*(size+gap),290+Math.sin(T*3+i)*6);ctx.scale(s,s);
    ctx.fillStyle=LETTERS[i][1];rr(-size/2,-size/2,size,size,30);ctx.fill();
    ctx.fillStyle='#fff';font(110);ctx.fillText(LETTERS[i][0],0,6);ctx.restore();
  }
  for(let i=0;i<3;i++){
    const t=Math.max(0,Math.min(1,(winT-1.2-i*0.25)/0.5));if(t<=0)continue;const s=easeOutBack(t),on=i<levelStars;
    ctx.save();ctx.translate(W/2+(i-1)*110,460);ctx.scale(s,s);
    ctx.fillStyle=on?'#ffd93d':'rgba(255,255,255,0.15)';starShape(0,0,42);ctx.fill();
    ctx.strokeStyle=on?'#e0a800':'rgba(255,255,255,0.4)';ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke();ctx.restore();
  }
  if(winT>1.8){font(48);shadowText(fmtTime(levelTime),W/2,560);}
}
function drawTitle(){
  const size=130,gap=14,x0=(W-(6*size+5*gap))/2+size/2;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<6;i++){
    ctx.save();ctx.translate(x0+i*(size+gap),200+Math.sin(T*2.5+i*0.7)*14);ctx.rotate(Math.sin(T*2+i)*0.05);
    ctx.fillStyle=LETTERS[i][1];rr(-size/2,-size/2,size,size,28);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.25)';rr(-size/2+12,-size/2+12,size-24,34,14);ctx.fill();
    ctx.fillStyle='#fff';font(96);ctx.fillText(LETTERS[i][0],0,6);ctx.restore();
  }
  for(const p of players)drawHint(p,1);
  ctx.globalAlpha=0.6+0.4*Math.sin(T*3);font(30);shadowText('Appuie sur une touche pour jouer',W/2,375);ctx.globalAlpha=1;
}
function draw(){
  drawSky(level);
  for(const pl of level.plats)drawPlat(pl[0],pl[1],pl[2],pl[3],level);
  drawGround(level);
  for(const it of items)drawItem(it);
  for(const p of players)drawPlayer(p);
  drawParticles();
  if(state==='title')drawTitle();
  else{
    if(hintT>0)for(const p of players)drawHint(p,Math.min(1,hintT));
    drawHUD();
    if(state==='win')drawWin();
  }
}

let last=performance.now();
function frame(now){const dt=Math.min(1/30,(now-last)/1000);last=now;T+=dt;update(dt);draw();requestAnimationFrame(frame);}
setupTitle();
requestAnimationFrame(frame);
</script>
